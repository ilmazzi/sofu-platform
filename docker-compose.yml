x-api-environment: &api-environment
  APP_NAME: ${APP_NAME:-Sofu}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-https://${SOFU_DOMAIN:-localhost}}
  FRONTEND_URL: ${FRONTEND_URL:-https://${SOFU_DOMAIN:-localhost}}
  APP_LOCALE: ${APP_LOCALE:-it}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
  APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-it_IT}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: ${DB_CONNECTION:-pgsql}
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-sofu}
  DB_USERNAME: ${DB_USERNAME:-sofu}
  DB_PASSWORD: ${DB_PASSWORD:-sofu_change_me}
  SESSION_DRIVER: ${SESSION_DRIVER:-file}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
  SESSION_PATH: ${SESSION_PATH:-/}
  SESSION_DOMAIN: ${SESSION_DOMAIN:-}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-${SOFU_DOMAIN:-localhost}}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${SOFU_DOMAIN:-localhost}}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
  CACHE_STORE: ${CACHE_STORE:-redis}
  REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_PORT: ${REDIS_PORT:-6379}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Sofu}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
  STRIPE_SECRET: ${STRIPE_SECRET:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  SIMULATION_ENABLED: ${SIMULATION_ENABLED:-false}
  SOFU_PAYMENT_ATTRITION_BUFFER: ${SOFU_PAYMENT_ATTRITION_BUFFER:-0.10}

services:
  caddy:
    image: sofu-caddy:${SOFU_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/caddy/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      SOFU_DOMAIN: ${SOFU_DOMAIN:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@example.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  api:
    image: sofu-api:${SOFU_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      <<: *api-environment
    volumes:
      - api_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment --no-ansi >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: sofu-api:${SOFU_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    restart: unless-stopped
    init: true
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=120"]
    environment:
      <<: *api-environment
    volumes:
      - api_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 60s

  scheduler:
    image: sofu-api:${SOFU_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    restart: unless-stopped
    init: true
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *api-environment
    volumes:
      - api_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 60s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sofu}
      POSTGRES_USER: ${DB_USERNAME:-sofu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sofu_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sofu} -d ${DB_DATABASE:-sofu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  api_storage:
  caddy_config:
  caddy_data:
  postgres_data:
  redis_data:
