openapi: 3.0.3
info:
  title: Sofu API
  version: 0.0.0
  description: |
    Contract for the Sofu Laravel API (`apps/api`). JSON resources use a top-level `data` wrapper
    (Laravel `JsonResource`).

    **Browser / SPA (Sanctum stateful):** use cookie sessions. For mutating requests, obtain a CSRF
    cookie from `GET /sanctum/csrf-cookie` (Laravel Sanctum), then send the `X-XSRF-TOKEN` header
    and cookies on API calls. Configure `SANCTUM_STATEFUL_DOMAINS` and CORS so the frontend origin
    is allowed.

    **Request correlation:** responses include `X-Request-Id` (or echo `X-Request-Id` from the client).
servers:
  - url: http://sofu-platform.test
    description: Local (Laravel Herd)
tags:
  - name: Health
  - name: Identity
  - name: Me
  - name: Campaigns
  - name: Reservations
  - name: Payments
  - name: Backoffice

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/me:
    get:
      tags: [Me]
      summary: Current authenticated user
      security:
        - session: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWrapped'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/me/campaigns:
    get:
      tags: [Me, Campaigns]
      summary: Campaigns owned by the current user (every status)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaigns'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/identity/register:
    post:
      tags: [Identity]
      summary: Register (starts session)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWrapped'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/identity/login:
    post:
      tags: [Identity]
      summary: Login (session)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWrapped'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/identity/logout:
    post:
      tags: [Identity]
      summary: Logout (invalidate session)
      security:
        - session: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/v1/identity/forgot-password:
    post:
      tags: [Identity]
      summary: Request password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/identity/reset-password:
    post:
      tags: [Identity]
      summary: Complete password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/identity/password:
    put:
      tags: [Identity]
      summary: Update password (authenticated)
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/identity/email/verification-notification:
    post:
      tags: [Identity]
      summary: Resend email verification
      security:
        - session: []
      responses:
        '200':
          description: Already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '202':
          description: Verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/identity/email/verify/{id}/{hash}:
    get:
      tags: [Identity]
      summary: Verify email (signed URL — query signature required)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: hash
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Invalid signature or hash

  /api/v1/campaigns:
    get:
      tags: [Campaigns]
      summary: List public campaigns
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaigns'
    post:
      tags: [Campaigns]
      summary: Create campaign draft
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCampaignRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignWrapped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/campaigns/{slug}/media:
    post:
      tags: [Campaigns]
      summary: Upload campaign images (draft only)
      description: Multipart upload of one or more images. Max 10 files per request; max 12 images per campaign total.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CampaignSlug'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: OK — campaign including updated media_urls
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignWrapped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/campaigns/{slug}:
    get:
      tags: [Campaigns]
      summary: Get campaign by slug
      security: []
      parameters:
        - $ref: '#/components/parameters/CampaignSlug'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignWrapped'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Campaigns]
      summary: Update editable campaign (creator, pre-live)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CampaignSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignWrapped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Campaigns]
      summary: Delete campaign (creator, no live reservations)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CampaignSlug'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/campaigns/{slug}/submit-for-review:
    post:
      tags: [Campaigns]
      summary: Submit draft for review
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CampaignSlug'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignWrapped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InvalidCampaignTransition'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/campaigns/{slug}/withdraw-review:
    post:
      tags: [Campaigns]
      summary: Return campaign from review to draft (creator)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CampaignSlug'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignWrapped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InvalidCampaignTransition'

  /api/v1/campaigns/{slug}/publish:
    post:
      tags: [Campaigns]
      summary: Publish approved campaign
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CampaignSlug'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignWrapped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InvalidCampaignTransition'

  /api/v1/backoffice/campaigns/{slug}/approve:
    post:
      tags: [Campaigns]
      summary: Approve campaign (operator/admin)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CampaignSlug'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignWrapped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InvalidCampaignTransition'

  /api/v1/backoffice/campaigns/{slug}/reject:
    post:
      tags: [Campaigns]
      summary: Reject campaign (operator/admin)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CampaignSlug'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignWrapped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/InvalidCampaignTransition'

  /api/v1/campaigns/{slug}/reservations:
    post:
      tags: [Reservations]
      summary: Create reservation (idempotent)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CampaignSlug'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Idempotent replay (same key + same supporter/campaign)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationWrapped'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationWrapped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Conflict (campaign closed, duplicate reservation, idempotency mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/me/reservations:
    get:
      tags: [Reservations]
      summary: List current user's reservations
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReservations'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/reservations/{reservation}/payment-intent:
    post:
      tags: [Payments]
      summary: Create or return mock payment intent
      security:
        - session: []
      parameters:
        - name: reservation
          in: path
          required: true
          schema:
            type: string
          description: Reservation id
      responses:
        '200':
          description: Existing intent returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentWrapped'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentWrapped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/payments/webhooks/mock:
    post:
      tags: [Payments]
      summary: Mock payment provider webhook (idempotent)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockPaymentWebhookRequest'
      responses:
        '200':
          description: Duplicate event replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockWebhookResult'
        '201':
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockWebhookResult'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/backoffice/campaigns:
    get:
      tags: [Backoffice]
      summary: List campaigns (filters)
      security:
        - session: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CampaignStatus'
        - name: creator_id
          in: query
          schema:
            type: integer
        - name: q
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBackofficeCampaigns'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/backoffice/campaigns/in-review:
    get:
      tags: [Backoffice]
      summary: List campaigns submitted for review
      security:
        - session: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBackofficeCampaigns'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/backoffice/campaigns/{slug}:
    get:
      tags: [Backoffice]
      summary: Backoffice campaign detail
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/CampaignSlug'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackofficeCampaignWrapped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/backoffice/audit-logs:
    get:
      tags: [Backoffice]
      summary: List audit logs
      security:
        - session: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: actor_id
          in: query
          schema:
            type: integer
        - name: target_type
          in: query
          schema:
            type: string
        - name: target_id
          in: query
          schema:
            type: integer
        - name: request_id
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogs'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/backoffice/ledger-entries:
    get:
      tags: [Backoffice]
      summary: List ledger entries
      security:
        - session: []
      parameters:
        - name: account
          in: query
          schema:
            type: string
        - name: source_type
          in: query
          schema:
            type: string
        - name: source_id
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLedgerEntries'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/backoffice/stats:
    get:
      tags: [Backoffice]
      summary: Dashboard KPI aggregates (plain JSON, no `data` wrapper)
      security:
        - session: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackofficeDashboardStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/backoffice/users:
    get:
      tags: [Backoffice]
      summary: List users (filters)
      security:
        - session: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [supporter, creator, operator, admin]
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBackofficeUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/backoffice/users/{id}:
    get:
      tags: [Backoffice]
      summary: User detail (backoffice)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackofficeUserWrapped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Backoffice]
      summary: Update user role
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [supporter, creator, operator, admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackofficeUserWrapped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Session cookie after login/register (name may vary via `SESSION_COOKIE`).

  parameters:
    CampaignSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 160

  responses:
    Unauthorized:
      description: Unauthenticated
    Forbidden:
      description: Forbidden
    NotFound:
      description: Not found
    ValidationError:
      description: Laravel validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LaravelValidationError'
    InvalidCampaignTransition:
      description: Invalid campaign status transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: sofu-api

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    SimpleMessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    LaravelValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    ApiErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    User:
      type: object
      required: [id, type, name, email, role]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [user]
        name:
          type: string
        email:
          type: string
        role:
          type: string
          description: supporter, creator, operator, admin
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    UserWrapped:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'

    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        password_confirmation:
          type: string
        role:
          type: string
          enum: [supporter, creator]
          description: Optional; defaults to supporter

